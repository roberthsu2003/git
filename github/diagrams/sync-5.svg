<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 523" width="960" height="523" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">CLI：一鍵建庫並直接 push</title><desc id="diagram-desc">網站建庫與 CLI 建庫三選一就好，不要重複執行；origin 已存在時先 remote -v 確認。 執行前：本地已有提交；status 乾淨；還沒有 origin；確認可見性。執行中：三件事一次完成；建立遠端儲存庫；命名為 origin；把 main 推上去。執行後：用一般 push；remote -v 看得到；repo view --web 開頁面；之後不用再 create</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="523" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">12｜同步三角：push、fetch、pull</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">CLI：一鍵建庫並直接 push</tspan></text>
<rect x="36" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">執行前</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">本地已有提交</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">status 乾淨</tspan><tspan x="56" dy="27">還沒有 origin</tspan><tspan x="56" dy="27">確認可見性</tspan></text>
<rect x="338" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">執行中</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">三件事一次完成</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">建立遠端儲存庫</tspan><tspan x="358" dy="27">命名為 origin</tspan><tspan x="358" dy="27">把 main 推上去</tspan></text>
<rect x="640" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">執行後</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">用一般 push</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">remote -v 看得到</tspan><tspan x="660" dy="27">repo view --web 開頁面</tspan><tspan x="660" dy="27">之後不用再 create</tspan></text>
<rect x="36" y="370" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="401" class="command"><tspan x="54" dy="0">gh repo create 名稱 --private --source=. --remote=origin --push</tspan></text>
<text x="36" y="468" class="note"><tspan x="36" dy="0">網站建庫與 CLI 建庫三選一就好，不要重複執行；origin 已存在時先 remote -v 確認。</tspan></text>
</svg>
