<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 523" width="960" height="523" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">查詢歷史不會移動分支</title><desc id="diagram-desc">這些查詢不會切換分支或改動工作區；真的要在舊版本操作才用 switch --detach。 show 與 ls-tree：只讀取不切換；show 看某筆內容；ls-tree 列該筆檔名；工作區不受影響。diff 比較兩筆：--name-status 列清單；第一筆只有三個 a；差異列出新增的 b；HEAD~3 沿第一父回溯</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="523" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">02｜main、HEAD 與歷史</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">查詢歷史不會移動分支</tspan></text>
<rect x="36" y="144" width="435" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">show 與 ls-tree</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">只讀取不切換</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">show 看某筆內容</tspan><tspan x="56" dy="27">ls-tree 列該筆檔名</tspan><tspan x="56" dy="27">工作區不受影響</tspan></text>
<rect x="489" y="144" width="435" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 146 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="182" class="card-title"><tspan x="509" dy="0">diff 比較兩筆</tspan></text>
<text x="509" y="212" class="tag"><tspan x="509" dy="0">--name-status 列清單</tspan></text>
<text x="509" y="249" class="body"><tspan x="509" dy="0">第一筆只有三個 a</tspan><tspan x="509" dy="27">差異列出新增的 b</tspan><tspan x="509" dy="27">HEAD~3 沿第一父回溯</tspan></text>
<rect x="36" y="370" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="401" class="command"><tspan x="54" dy="0">git show HEAD；git ls-tree --name-only HEAD~3；git diff --name-status HEAD~3 HEAD</tspan></text>
<text x="36" y="468" class="note"><tspan x="36" dy="0">這些查詢不會切換分支或改動工作區；真的要在舊版本操作才用 switch --detach。</tspan></text>
</svg>
