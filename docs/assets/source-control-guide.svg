<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
<title id="title">VS Code Source Control 操作位置示意</title><desc id="desc">示意圖顯示 Source Control、Commit 訊息、Staged Changes 與 Changes；數字代表操作順序。</desc>
<rect width="900" height="510" rx="18" fill="#f3f5ef"/><rect x="25" y="28" width="470" height="452" rx="12" fill="#24362f"/><rect x="25" y="28" width="55" height="452" rx="12" fill="#192820"/><text x="42" y="97" fill="#fff" font-size="24" font-family="sans-serif">⑂</text><rect x="25" y="59" width="4" height="51" fill="#df8054"/>
<g font-family="system-ui,sans-serif"><text x="104" y="72" fill="#eaf1e9" font-size="19" font-weight="bold">SOURCE CONTROL</text><rect x="105" y="97" width="358" height="48" rx="5" fill="#172820" stroke="#8da292"/><text x="120" y="127" fill="#c8d9ca" font-size="17">Message (Commit Message)</text><rect x="105" y="159" width="358" height="38" rx="5" fill="#b45636"/><text x="255" y="184" fill="white" font-size="17">✓ Commit</text><text x="105" y="241" fill="#eaf1e9" font-size="17">⌄  Staged Changes</text><text x="127" y="272" fill="#c8d9ca" font-size="16">hello.py</text><text x="105" y="325" fill="#eaf1e9" font-size="17">⌄  Changes</text><text x="127" y="357" fill="#c8d9ca" font-size="16">hello.py</text><text x="430" y="357" fill="#fff" font-size="22">+</text><text x="105" y="427" fill="#9db4a3" font-size="14">畫面僅為示意，非實際截圖</text>
<g font-size="20" fill="#243a33"><text x="535" y="96" font-weight="bold">① 開啟 Source Control</text><text x="535" y="184" font-weight="bold">② Changes 查看差異</text><text x="535" y="272" font-weight="bold">③ 按 + 加入 Stage</text><text x="535" y="360" font-weight="bold">④ 寫訊息並按 Commit</text></g><g font-size="15" fill="#64776a"><text x="535" y="121">左側活動列的分支圖示</text><text x="535" y="209">點檔案檢查修改</text><text x="535" y="297">確認 Staged Changes 內容</text><text x="535" y="385">提交已暫存的版本</text></g><text x="535" y="451" font-size="14" fill="#64776a">版本與版面配置可能不同</text></g></svg>
