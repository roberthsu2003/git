<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 667" width="960" height="667" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Squash：目標只新增一筆</title><desc id="diagram-desc">squash 先準備變更；本機需要另行 commit。 目標分支：C0 → S；S 包含 A、B 的整合內容；A、B 不是 S 的父提交。功能分支：仍指向原本的 B；A、B 還在 feature-login；圖中只畫出目標歷史</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="667" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">延伸｜比較合併方式</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">Squash：目標只新增一筆</tspan></text>
<path d="M 150 175 L 750 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<circle cx="150" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="150" y="181" text-anchor="middle" class="commit">C0</text><text x="150" y="141" text-anchor="middle" class="ref">共同起點</text>
<circle cx="750" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="750" y="181" text-anchor="middle" class="commit">S</text><text x="750" y="141" text-anchor="middle" class="ref">compare-squash</text>
<text x="36" y="294" class="eyebrow"><tspan x="36" dy="0">圓點是 commit；線表示父子關係；名稱標示分支指向的位置。</tspan></text>
<rect x="36" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 317 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="353" class="card-title"><tspan x="56" dy="0">目標分支</tspan></text>
<text x="56" y="383" class="tag"><tspan x="56" dy="0">C0 → S</tspan></text>
<text x="56" y="420" class="body"><tspan x="56" dy="0">S 包含 A、B 的整合內容</tspan><tspan x="56" dy="27">A、B 不是 S 的父提交</tspan></text>
<rect x="489" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 317 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="353" class="card-title"><tspan x="509" dy="0">功能分支</tspan></text>
<text x="509" y="383" class="tag"><tspan x="509" dy="0">仍指向原本的 B</tspan></text>
<text x="509" y="420" class="body"><tspan x="509" dy="0">A、B 還在 feature-login</tspan><tspan x="509" dy="27">圖中只畫出目標歷史</tspan></text>
<rect x="36" y="514" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="545" class="command"><tspan x="54" dy="0">git merge --squash feature-login；git commit</tspan></text>
<text x="36" y="612" class="note"><tspan x="36" dy="0">squash 先準備變更；本機需要另行 commit。</tspan></text>
</svg>
