<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="960" height="496" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">先保留起點，開一個任務分支</title><desc id="diagram-desc">先處理既有修改；一次只交給 AI 一項能清楚驗收的任務。 main：已確認的起點；Search: ready。ai/search-hint：本輪任務；只新增輸入提示；不改登入或資料庫</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="496" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">08｜AI 開發的 Git 節奏</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">先保留起點，開一個任務分支</tspan></text>
<rect x="36" y="144" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">main</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">已確認的起點</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">Search: ready</tspan></text>
<rect x="489" y="144" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 146 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="182" class="card-title"><tspan x="509" dy="0">ai/search-hint</tspan></text>
<text x="509" y="212" class="tag"><tspan x="509" dy="0">本輪任務</tspan></text>
<text x="509" y="249" class="body"><tspan x="509" dy="0">只新增輸入提示</tspan><tspan x="509" dy="27">不改登入或資料庫</tspan></text>
<rect x="36" y="343" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="374" class="command"><tspan x="54" dy="0">git status；git switch -c ai/search-hint</tspan></text>
<text x="36" y="441" class="note"><tspan x="36" dy="0">先處理既有修改；一次只交給 AI 一項能清楚驗收的任務。</tspan></text>
</svg>
