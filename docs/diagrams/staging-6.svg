<text x="56" y="249" class="body"><tspan x="56" dy="0">Home page</tspan><tspan x="56" dy="27">About our team</tspan><tspan x="56" dy="27">Contact us</tspan></text>
<rect x="338" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">暫存區</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">與新 HEAD 相同</tspan></text>
