<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 667" width="960" height="667" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">squash：三筆合成一筆</title><desc id="diagram-desc">不要 squash 第一行，範圍內沒有前一筆可合；before-rebase 分支留著比較成果。 合併：內容相加；三個頁面都在；整理訊息為一句。fixup 的差別：丟棄該筆訊息；沿用前面的訊息；與 squash 訊息處理不同</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="667" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">15｜rebase：整理尚未分享的歷史</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">squash：三筆合成一筆</tspan></text>
<path d="M 120 175 L 460 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<circle cx="120" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="120" y="181" text-anchor="middle" class="commit">C1</text><text x="120" y="141" text-anchor="middle" class="ref">起點</text>
<circle cx="460" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="460" y="181" text-anchor="middle" class="commit">C234</text><text x="460" y="141" text-anchor="middle" class="ref">HEAD → 功能分支（三合一）</text>
<text x="36" y="294" class="eyebrow"><tspan x="36" dy="0">圓點是 commit；線表示父子關係；名稱標示分支指向的位置。</tspan></text>
<rect x="36" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 317 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="353" class="card-title"><tspan x="56" dy="0">合併</tspan></text>
<text x="56" y="383" class="tag"><tspan x="56" dy="0">內容相加</tspan></text>
<text x="56" y="420" class="body"><tspan x="56" dy="0">三個頁面都在</tspan><tspan x="56" dy="27">整理訊息為一句</tspan></text>
<rect x="489" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 317 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="353" class="card-title"><tspan x="509" dy="0">fixup 的差別</tspan></text>
<text x="509" y="383" class="tag"><tspan x="509" dy="0">丟棄該筆訊息</tspan></text>
<text x="509" y="420" class="body"><tspan x="509" dy="0">沿用前面的訊息</tspan><tspan x="509" dy="27">與 squash 訊息處理不同</tspan></text>
<rect x="36" y="514" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="545" class="command"><tspan x="54" dy="0">第一行 pick，後兩行改 squash</tspan></text>
<text x="36" y="612" class="note"><tspan x="36" dy="0">不要 squash 第一行，範圍內沒有前一筆可合；before-rebase 分支留著比較成果。</tspan></text>
</svg>
