<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 523" width="960" height="523" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">pull 被拒絕：先看歷史再選邊</title><desc id="diagram-desc">push 出現 non-fast-forward 不等於已發生衝突；不要用 force 覆蓋遠端。 non-fast-forward：遠端拒絕更新；不是檔案衝突；是歷史已分岔；先 fetch 看圖。沒分岔：快轉即可；本地是祖先；--ff-only 直接成功。已分岔：不要硬推；不要 force 覆蓋；選 merge 或 rebase；先看懂再整合</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="523" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">12｜同步三角：push、fetch、pull</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">pull 被拒絕：先看歷史再選邊</tspan></text>
<rect x="36" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">non-fast-forward</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">遠端拒絕更新</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">不是檔案衝突</tspan><tspan x="56" dy="27">是歷史已分岔</tspan><tspan x="56" dy="27">先 fetch 看圖</tspan></text>
<rect x="338" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">沒分岔</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">快轉即可</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">本地是祖先</tspan><tspan x="358" dy="27">--ff-only 直接成功</tspan></text>
<rect x="640" y="144" width="284" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">已分岔</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">不要硬推</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">不要 force 覆蓋</tspan><tspan x="660" dy="27">選 merge 或 rebase</tspan><tspan x="660" dy="27">先看懂再整合</tspan></text>
<rect x="36" y="370" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="401" class="command"><tspan x="54" dy="0">git pull --ff-only origin main（分岔時拒絕）</tspan></text>
<text x="36" y="468" class="note"><tspan x="36" dy="0">push 出現 non-fast-forward 不等於已發生衝突；不要用 force 覆蓋遠端。</tspan></text>
</svg>
