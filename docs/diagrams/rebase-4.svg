<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="960" height="496" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">卡關：中止、繼續與不改共享歷史</title><desc id="diagram-desc">已共享的分支改寫需團隊約定；before-rebase 保留用來比較，刪除被拒絕是正常的。 abort：取消本次操作；仍在整理中可用；不要直接 reset 猜狀態。skip：略過一筆提交；不能當解衝突方法；先讀 status 再決定。共享分支：用 merge 不改寫；初學協作先 merge；改寫需團隊約定</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="496" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">15｜rebase：整理尚未分享的歷史</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">卡關：中止、繼續與不改共享歷史</tspan></text>
<rect x="36" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">abort</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">取消本次操作</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">仍在整理中可用</tspan><tspan x="56" dy="27">不要直接 reset 猜狀態</tspan></text>
<rect x="338" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">skip</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">略過一筆提交</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">不能當解衝突方法</tspan><tspan x="358" dy="27">先讀 status 再決定</tspan></text>
<rect x="640" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">共享分支</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">用 merge 不改寫</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">初學協作先 merge</tspan><tspan x="660" dy="27">改寫需團隊約定</tspan></text>
<rect x="36" y="343" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="374" class="command"><tspan x="54" dy="0">衝突時修正後繼續；整理中用 abort 取消</tspan></text>
<text x="36" y="441" class="note"><tspan x="36" dy="0">已共享的分支改寫需團隊約定；before-rebase 保留用來比較，刪除被拒絕是正常的。</tspan></text>
</svg>
