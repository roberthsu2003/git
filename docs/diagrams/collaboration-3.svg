<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">push：上傳的是各自任務分支</title><desc id="diagram-desc">上傳功能分支，不等於把它合併到 main。 A 的電腦：已 push；docs-course → GitHub。GitHub：兩條分支已上傳；main：仍只有 README.md；docs-course：course.md；docs-members：members.md。B 的電腦：已 push；docs-members → GitHub</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="550" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">05｜GitHub 共同開發</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">push：上傳的是各自任務分支</tspan></text>
<rect x="36" y="144" width="284" height="229" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">A 的電腦</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">已 push</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">docs-course → GitHub</tspan></text>
<rect x="338" y="144" width="284" height="229" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">GitHub</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">兩條分支已上傳</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">main：仍只有 README.md</tspan><tspan x="358" dy="27">docs-course：course.md</tspan><tspan x="358" dy="27">docs-members：members.m</tspan><tspan x="358" dy="27">d</tspan></text>
<rect x="640" y="144" width="284" height="229" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">B 的電腦</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">已 push</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">docs-members → GitHub</tspan></text>
<rect x="36" y="397" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="428" class="command"><tspan x="54" dy="0">git push -u origin docs-course／docs-members</tspan></text>
<text x="36" y="495" class="note"><tspan x="36" dy="0">上傳功能分支，不等於把它合併到 main。</tspan></text>
</svg>
