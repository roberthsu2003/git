<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="960" height="496" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">送 PR、審查後整合，再更新 main</title><desc id="diagram-desc">多項任務可各開分支與 worktree，但仍需處理整合衝突。 任務分支：完成本輪需求；差異已閱讀；檢查結果已記錄。GitHub PR：同學審查；說明改了什麼；說明如何驗證。main：已整合可用版本；Search: ready；Hint: enter a keyword</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="496" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">08｜AI 開發的 Git 節奏</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">送 PR、審查後整合，再更新 main</tspan></text>
<rect x="36" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">任務分支</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">完成本輪需求</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">差異已閱讀</tspan><tspan x="56" dy="27">檢查結果已記錄</tspan></text>
<rect x="338" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">GitHub PR</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">同學審查</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">說明改了什麼</tspan><tspan x="358" dy="27">說明如何驗證</tspan></text>
<rect x="640" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">main</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">已整合可用版本</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">Search: ready</tspan><tspan x="660" dy="27">Hint: enter a keyword</tspan></text>
<rect x="36" y="343" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="374" class="command"><tspan x="54" dy="0">push 任務分支 → PR → 審查與 merge → pull</tspan></text>
<text x="36" y="441" class="note"><tspan x="36" dy="0">多項任務可各開分支與 worktree，但仍需處理整合衝突。</tspan></text>
</svg>
