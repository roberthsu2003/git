<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 667" width="960" height="667" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">reword：三筆訊息逐一重寫</title><desc id="diagram-desc">本練習共四筆，HEAD~3 存在可照用；整理含根提交才用 rebase 相關的 root 選項。 編輯器：最舊到最新；三行都改 reword；保留識別碼與順序。儲存後：依序編輯三次；檔案內容不變；三筆識別碼都改變</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="667" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">15｜rebase：整理尚未分享的歷史</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">reword：三筆訊息逐一重寫</tspan></text>
<path d="M 120 175 L 350 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<path d="M 350 175 L 580 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<path d="M 580 175 L 810 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<circle cx="120" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="120" y="181" text-anchor="middle" class="commit">C1</text><text x="120" y="141" text-anchor="middle" class="ref">起點（不動）</text>
<circle cx="350" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="350" y="181" text-anchor="middle" class="commit">C2</text><text x="350" y="141" text-anchor="middle" class="ref">f4（改訊息）</text>
<circle cx="580" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="580" y="181" text-anchor="middle" class="commit">C3</text><text x="580" y="141" text-anchor="middle" class="ref">f5（改訊息）</text>
<circle cx="810" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="810" y="181" text-anchor="middle" class="commit">C4</text><text x="810" y="141" text-anchor="middle" class="ref">HEAD → 功能分支</text>
<text x="36" y="294" class="eyebrow"><tspan x="36" dy="0">圓點是 commit；線表示父子關係；名稱標示分支指向的位置。</tspan></text>
<rect x="36" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 317 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="353" class="card-title"><tspan x="56" dy="0">編輯器</tspan></text>
<text x="56" y="383" class="tag"><tspan x="56" dy="0">最舊到最新</tspan></text>
<text x="56" y="420" class="body"><tspan x="56" dy="0">三行都改 reword</tspan><tspan x="56" dy="27">保留識別碼與順序</tspan></text>
<rect x="489" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 317 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="353" class="card-title"><tspan x="509" dy="0">儲存後</tspan></text>
<text x="509" y="383" class="tag"><tspan x="509" dy="0">依序編輯三次</tspan></text>
<text x="509" y="420" class="body"><tspan x="509" dy="0">檔案內容不變</tspan><tspan x="509" dy="27">三筆識別碼都改變</tspan></text>
<rect x="36" y="514" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="545" class="command"><tspan x="54" dy="0">git rebase -i HEAD~3（pick 改 reword）</tspan></text>
<text x="36" y="612" class="note"><tspan x="36" dy="0">本練習共四筆，HEAD~3 存在可照用；整理含根提交才用 rebase 相關的 root 選項。</tspan></text>
</svg>
