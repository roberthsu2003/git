<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="960" height="496" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">push：上傳指定分支</title><desc id="diagram-desc">push 只上傳提交，不含未提交檔案，也不會自動合併功能分支與 main。 本地 main：已有新 commit；C2 已提交；只上傳提交。GitHub main：收到 C2；網頁看得到新提交；-u 設定上游追蹤。origin/main：同步到新位置；push 後自動更新；未提交檔案不會上傳</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="496" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">12｜同步三角：push、fetch、pull</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">push：上傳指定分支</tspan></text>
<rect x="36" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">本地 main</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">已有新 commit</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">C2 已提交</tspan><tspan x="56" dy="27">只上傳提交</tspan></text>
<rect x="338" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">GitHub main</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">收到 C2</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">網頁看得到新提交</tspan><tspan x="358" dy="27">-u 設定上游追蹤</tspan></text>
<rect x="640" y="144" width="284" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">origin/main</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">同步到新位置</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">push 後自動更新</tspan><tspan x="660" dy="27">未提交檔案不會上傳</tspan></text>
<rect x="36" y="343" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="374" class="command"><tspan x="54" dy="0">git push -u origin main</tspan></text>
<text x="36" y="441" class="note"><tspan x="36" dy="0">push 只上傳提交，不含未提交檔案，也不會自動合併功能分支與 main。</tspan></text>
</svg>
