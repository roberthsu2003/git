<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 667" width="960" height="667" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">已提交的錯誤：追加 revert commit</title><desc id="diagram-desc">共享分支保留歷史；revert 不是刪掉舊 commit，也可能需要解決衝突。 現在的檔案：C3 反轉 C2 的修改；Search: ready；Hint: enter a keyword。歷史紀錄：追加修正；C2 仍在歷史裡；C3 是新的 revert commit</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="667" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">08｜AI 開發的 Git 節奏</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">已提交的錯誤：追加 revert commit</tspan></text>
<path d="M 150 175 L 460 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<path d="M 460 175 L 770 175" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<circle cx="150" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="150" y="181" text-anchor="middle" class="commit">C1</text><text x="150" y="141" text-anchor="middle" class="ref">可用起點</text>
<circle cx="460" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="460" y="181" text-anchor="middle" class="commit">C2</text><text x="460" y="141" text-anchor="middle" class="ref">錯誤修改</text>
<circle cx="770" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="770" y="181" text-anchor="middle" class="commit">C3</text><text x="770" y="141" text-anchor="middle" class="ref">HEAD → 任務分支</text>
<text x="36" y="294" class="eyebrow"><tspan x="36" dy="0">圓點是 commit；線表示父子關係；名稱標示分支指向的位置。</tspan></text>
<rect x="36" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 317 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="353" class="card-title"><tspan x="56" dy="0">現在的檔案</tspan></text>
<text x="56" y="383" class="tag"><tspan x="56" dy="0">C3 反轉 C2 的修改</tspan></text>
<text x="56" y="420" class="body"><tspan x="56" dy="0">Search: ready</tspan><tspan x="56" dy="27">Hint: enter a keyword</tspan></text>
<rect x="489" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 317 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="353" class="card-title"><tspan x="509" dy="0">歷史紀錄</tspan></text>
<text x="509" y="383" class="tag"><tspan x="509" dy="0">追加修正</tspan></text>
<text x="509" y="420" class="body"><tspan x="509" dy="0">C2 仍在歷史裡</tspan><tspan x="509" dy="27">C3 是新的 revert commit</tspan></text>
<rect x="36" y="514" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="545" class="command"><tspan x="54" dy="0">錯誤修改 commit 後：git revert --no-edit HEAD</tspan></text>
<text x="36" y="612" class="note"><tspan x="36" dy="0">共享分支保留歷史；revert 不是刪掉舊 commit，也可能需要解決衝突。</tspan></text>
</svg>
