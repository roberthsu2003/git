<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 393" width="440" height="393" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">先保留起點，開一個任務分支</title><desc id="diagram-desc">先處理既有修改；一次只交給 AI 一項能清楚驗收的任務。 main：已確認的起點；Search: ready。ai/search-hint：本輪任務；只新增輸入提示；不改登入或資料庫</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="393" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">main</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">已確認的起點</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">Search: ready</tspan></text>
<rect x="16" y="200" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">ai/search-hint</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">本輪任務</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">只新增輸入提示</tspan><tspan x="36" dy="27">不改登入或資料庫</tspan></text>
