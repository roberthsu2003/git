<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">正確修改：驗證後才 commit</title><desc id="diagram-desc">程式專案要實際測試或操作功能；格式檢查不能取代功能驗證。 工作區與暫存區：檢查過的版本；Search: ready；Hint: enter a keyword。任務分支 commit：小段完整變更；新增搜尋輸入提示；未混入其他功能</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="400" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">工作區與暫存區</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">檢查過的版本</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">Search: ready</tspan><tspan x="36" dy="27">Hint: enter a keyword</tspan></text>
<rect x="16" y="207" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 209 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="245" class="card-title"><tspan x="36" dy="0">任務分支 commit</tspan></text>
<text x="36" y="275" class="tag"><tspan x="36" dy="0">小段完整變更</tspan></text>
<text x="36" y="312" class="body"><tspan x="36" dy="0">新增搜尋輸入提示</tspan><tspan x="36" dy="27">未混入其他功能</tspan></text>
</svg>
