<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 575" width="440" height="575" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">已 commit：共享歷史可用 revert 追加修正</title><desc id="diagram-desc">若使用 reset --hard 則是移動分支並覆蓋檔案，屬於另一種操作；不要把兩者混在一起。 原本的 commit：保留歷史；記錄刪除或錯誤修改。新的 revert commit：反向修改；恢復原本內容；可能需要解決衝突。目前分支：往新 commit 移動；不是把指標往回移動</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="575" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">原本的 commit</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">保留歷史</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">記錄刪除或錯誤修改</tspan></text>
<rect x="16" y="200" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">新的 revert commit</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">反向修改</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">恢復原本內容</tspan><tspan x="36" dy="27">可能需要解決衝突</tspan></text>
<rect x="16" y="389" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 391 H 412" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="427" class="card-title"><tspan x="36" dy="0">目前分支</tspan></text>
<text x="36" y="457" class="tag"><tspan x="36" dy="0">往新 commit 移動</tspan></text>
<text x="36" y="494" class="body"><tspan x="36" dy="0">不是把指標往回移動</tspan></text>
</svg>
