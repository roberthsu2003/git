<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 730" width="440" height="730" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">只改訊息：檔案不變，識別碼仍改變</title><desc id="diagram-desc">即使只改一個字，amend 仍建立全新的 commit；識別碼一定改變。 C1：舊訊息版本：原本 commit；檔案相同；訊息有錯字；main 不再指向它。C2：新訊息版本：新的識別碼；檔案與 C1 相同；訊息已修正；相同的父 commit P</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="730" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">P</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">共同父 commit</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">C1</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">原本訊息</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：P</tspan></text>
<circle cx="48" cy="234" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="240" text-anchor="middle" class="commit">C2</text>
<text x="84" y="226" class="ref"><tspan x="84" dy="0">HEAD → main</tspan></text>
<text x="84" y="277" class="eyebrow"><tspan x="84" dy="0">父 commit：P</tspan></text>
<rect x="16" y="294" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 296 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="332" class="card-title"><tspan x="36" dy="0">C1：舊訊息版本</tspan></text>
<text x="36" y="362" class="tag"><tspan x="36" dy="0">原本 commit</tspan></text>
<text x="36" y="399" class="body"><tspan x="36" dy="0">檔案相同</tspan><tspan x="36" dy="27">訊息有錯字</tspan><tspan x="36" dy="27">main 不再指向它</tspan></text>
<rect x="16" y="510" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 512 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="548" class="card-title"><tspan x="36" dy="0">C2：新訊息版本</tspan></text>
<text x="36" y="578" class="tag"><tspan x="36" dy="0">新的識別碼</tspan></text>
<text x="36" y="615" class="body"><tspan x="36" dy="0">檔案與 C1 相同</tspan><tspan x="36" dy="27">訊息已修正</tspan><tspan x="36" dy="27">相同的父 commit P</tspan></text>
</svg>
