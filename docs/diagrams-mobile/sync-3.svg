<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 582" width="440" height="582" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">fetch：只下載，不整合工作區</title><desc id="diagram-desc">fetch 不會動你的檔案；想看差異再用 log 或 diff 比較本地與 origin/main。 GitHub main：別人已 push C3；遠端已有新版本。origin/main：更新到 C3；本機紀錄已更新；工作區還沒變。本地 main：仍在 C2；檔案不受影響；要整合再選 merge 或 rebase</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="582" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">GitHub main</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">別人已 push C3</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">遠端已有新版本</tspan></text>
<rect x="16" y="200" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">origin/main</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">更新到 C3</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">本機紀錄已更新</tspan><tspan x="36" dy="27">工作區還沒變</tspan></text>
<rect x="16" y="389" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 391 H 412" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="427" class="card-title"><tspan x="36" dy="0">本地 main</tspan></text>
<text x="36" y="457" class="tag"><tspan x="36" dy="0">仍在 C2</tspan></text>
<text x="36" y="494" class="body"><tspan x="36" dy="0">檔案不受影響</tspan><tspan x="36" dy="27">要整合再選 merge 或 rebase</tspan></text>
</svg>
