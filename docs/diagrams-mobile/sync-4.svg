<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 643" width="440" height="643" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">pull 被拒絕：先看歷史再選邊</title><desc id="diagram-desc">push 出現 non-fast-forward 不等於已發生衝突；不要用 force 覆蓋遠端。 non-fast-forward：遠端拒絕更新；不是檔案衝突；是歷史已分岔；先 fetch 看圖。沒分岔：快轉即可；本地是祖先；--ff-only 直接成功。已分岔：不要硬推；不要 force 覆蓋；選 merge 或 rebase；先看懂再整合</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="643" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">non-fast-forward</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">遠端拒絕更新</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">不是檔案衝突</tspan><tspan x="36" dy="27">是歷史已分岔</tspan><tspan x="36" dy="27">先 fetch 看圖</tspan></text>
<rect x="16" y="234" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 236 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="272" class="card-title"><tspan x="36" dy="0">沒分岔</tspan></text>
<text x="36" y="302" class="tag"><tspan x="36" dy="0">快轉即可</tspan></text>
<text x="36" y="339" class="body"><tspan x="36" dy="0">本地是祖先</tspan><tspan x="36" dy="27">--ff-only 直接成功</tspan></text>
<rect x="16" y="423" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 425 H 412" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="461" class="card-title"><tspan x="36" dy="0">已分岔</tspan></text>
<text x="36" y="491" class="tag"><tspan x="36" dy="0">不要硬推</tspan></text>
<text x="36" y="528" class="body"><tspan x="36" dy="0">不要 force 覆蓋</tspan><tspan x="36" dy="27">選 merge 或 rebase</tspan><tspan x="36" dy="27">先看懂再整合</tspan></text>
</svg>
