<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 299" width="440" height="299" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">新分支：先指向同一個 commit</title><desc id="diagram-desc">建立分支不會立刻讓檔案變不同；要修改與 commit，路線才會往前。 branch-demo/：目前分支 feature-login；index.txt：Home page；檔案暫時和 main 一樣</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="299" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C1</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">main、HEAD → feature-login</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<rect x="16" y="106" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 108 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="144" class="card-title"><tspan x="36" dy="0">branch-demo/</tspan></text>
<text x="36" y="174" class="tag"><tspan x="36" dy="0">目前分支 feature-login</tspan></text>
<text x="36" y="211" class="body"><tspan x="36" dy="0">index.txt：Home page</tspan><tspan x="36" dy="27">檔案暫時和 main 一樣</tspan></text>
</svg>
