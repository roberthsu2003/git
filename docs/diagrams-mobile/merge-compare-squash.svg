<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 582" width="440" height="582" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Squash：目標只新增一筆</title><desc id="diagram-desc">squash 先準備變更；本機需要另行 commit。 目標分支：C0 → S；S 包含 A、B 的整合內容；A、B 不是 S 的父提交。功能分支：仍指向原本的 B；A、B 還在 feature-login；圖中只畫出目標歷史</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="582" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C0</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">共同起點</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">S</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">compare-squash</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：C0</tspan></text>
<rect x="16" y="200" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">目標分支</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">C0 → S</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">S 包含 A、B 的整合內容</tspan><tspan x="36" dy="27">A、B 不是 S 的父提交</tspan></text>
<rect x="16" y="389" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 391 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="427" class="card-title"><tspan x="36" dy="0">功能分支</tspan></text>
<text x="36" y="457" class="tag"><tspan x="36" dy="0">仍指向原本的 B</tspan></text>
<text x="36" y="494" class="body"><tspan x="36" dy="0">A、B 還在 feature-login</tspan><tspan x="36" dy="27">圖中只畫出目標歷史</tspan></text>
</svg>
