<text x="36" y="56" class="card-title"><tspan x="36" dy="0">worktree-demo/</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">main</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">index.txt：Home title</tspan><tspan x="36" dy="27">login.txt：含密碼欄位</tspan><tspan x="36" dy="27">兩項成果都已整合</tspan></text>
<rect x="16" y="234" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 236 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="272" class="card-title"><tspan x="36" dy="0">worktree-hotfix/</tspan></text>
<text x="36" y="302" class="tag"><tspan x="36" dy="0">hotfix-title</tspan></text>
