<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 427" width="440" height="427" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">在修正資料夾改好並 commit</title><desc id="diagram-desc">另一邊 commit 不會自動更新原資料夾；原工作也不會被一起提交。 worktree-demo/：feature-login；index.txt：Home titel；會員未提交修改仍在。worktree-hotfix/：hotfix-title；index.txt：Home title；修正已 commit；沒有 login.txt</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="427" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">worktree-demo/</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">feature-login</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">index.txt：Home titel</tspan><tspan x="36" dy="27">會員未提交修改仍在</tspan></text>
<rect x="16" y="207" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 209 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="245" class="card-title"><tspan x="36" dy="0">worktree-hotfix/</tspan></text>
<text x="36" y="275" class="tag"><tspan x="36" dy="0">hotfix-title</tspan></text>
<text x="36" y="312" class="body"><tspan x="36" dy="0">index.txt：Home title</tspan><tspan x="36" dy="27">修正已 commit</tspan><tspan x="36" dy="27">沒有 login.txt</tspan></text>
</svg>
