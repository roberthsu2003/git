<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 602" width="440" height="602" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">merge：兩份 PR 都合併到 GitHub main</title><desc id="diagram-desc">線上合併不會遠端修改兩人的電腦。 A 的電腦：本地 main 還沒更新；仍需切回 main、pull。GitHub main：已整合；README.md；course.md；members.md。B 的電腦：本地 main 還沒更新；仍需切回 main、pull</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="602" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">A 的電腦</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">本地 main 還沒更新</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">仍需切回 main、pull</tspan></text>
<rect x="16" y="200" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">GitHub main</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">已整合</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">README.md</tspan><tspan x="36" dy="27">course.md</tspan><tspan x="36" dy="27">members.md</tspan></text>
<rect x="16" y="416" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 418 H 412" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="454" class="card-title"><tspan x="36" dy="0">B 的電腦</tspan></text>
