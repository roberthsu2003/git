<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 582" width="440" height="582" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">查看標籤：先看再回 main</title><desc id="diagram-desc">detached 的新提交沒有分支會迷路；只是查看就好，看完切回 main。 detached HEAD：暫時指向標籤；看到 Release 1；新提交要用分支保留。回 main：switch main；回到最新版本；標籤仍在原位置</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="582" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C2</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">v1.0、HEAD（暫時）</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">C3</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">main</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：C2</tspan></text>
<rect x="16" y="200" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">detached HEAD</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">暫時指向標籤</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">看到 Release 1</tspan><tspan x="36" dy="27">新提交要用分支保留</tspan></text>
<rect x="16" y="389" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 391 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="427" class="card-title"><tspan x="36" dy="0">回 main</tspan></text>
<text x="36" y="457" class="tag"><tspan x="36" dy="0">switch main</tspan></text>
<text x="36" y="494" class="body"><tspan x="36" dy="0">回到最新版本</tspan><tspan x="36" dy="27">標籤仍在原位置</tspan></text>
</svg>
