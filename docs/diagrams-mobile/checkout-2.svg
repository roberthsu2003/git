<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 676" width="440" height="676" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">要在舊版本開工：先開分支留住</title><desc id="diagram-desc">分支名在前、起點在後；在 detached 直接提交會迷路，先用分支保留。 experiment：新的分支名稱；指向舊版本；新提交接在後面。main：不受影響；仍在最新版本；兩條線各自發展</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="676" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C1</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">HEAD → experiment</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">C2</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">經過的版本</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：C1</tspan></text>
<circle cx="48" cy="234" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="240" text-anchor="middle" class="commit">C3</text>
<text x="84" y="226" class="ref"><tspan x="84" dy="0">main</tspan></text>
<text x="84" y="277" class="eyebrow"><tspan x="84" dy="0">父 commit：C2</tspan></text>
<rect x="16" y="294" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 296 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="332" class="card-title"><tspan x="36" dy="0">experiment</tspan></text>
<text x="36" y="362" class="tag"><tspan x="36" dy="0">新的分支名稱</tspan></text>
<text x="36" y="399" class="body"><tspan x="36" dy="0">指向舊版本</tspan><tspan x="36" dy="27">新提交接在後面</tspan></text>
<rect x="16" y="483" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 485 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="521" class="card-title"><tspan x="36" dy="0">main</tspan></text>
<text x="36" y="551" class="tag"><tspan x="36" dy="0">不受影響</tspan></text>
<text x="36" y="588" class="body"><tspan x="36" dy="0">仍在最新版本</tspan><tspan x="36" dy="27">兩條線各自發展</tspan></text>
</svg>
