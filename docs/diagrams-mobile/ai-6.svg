<text x="36" y="245" class="card-title"><tspan x="36" dy="0">GitHub PR</tspan></text>
<text x="36" y="275" class="tag"><tspan x="36" dy="0">同學審查</tspan></text>
<text x="36" y="312" class="body"><tspan x="36" dy="0">說明改了什麼</tspan><tspan x="36" dy="27">說明如何驗證</tspan></text>
