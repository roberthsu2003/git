<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 770" width="440" height="770" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Rebase：接到更新後的起點</title><desc id="diagram-desc">本例另建 feature-rebase，沒有改寫原 feature-login。 目標歷史：沒有 merge commit；A′、B′ 接在 D 後面；識別碼與原本 A、B 不同。原功能分支：本例保留 feature-login；仍指向原來的 A、B；圖中只畫出目標歷史</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="770" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C0</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">共同起點</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">D</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">新增版本說明</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：C0</tspan></text>
<circle cx="48" cy="234" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="240" text-anchor="middle" class="commit">A′</text>
<text x="84" y="226" class="ref"><tspan x="84" dy="0">重套登入表單</tspan></text>
<text x="84" y="277" class="eyebrow"><tspan x="84" dy="0">父 commit：D</tspan></text>
<circle cx="48" cy="328" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="334" text-anchor="middle" class="commit">B′</text>
<text x="84" y="320" class="ref"><tspan x="84" dy="0">compare-rebase</tspan></text>
<text x="84" y="371" class="eyebrow"><tspan x="84" dy="0">父 commit：A′</tspan></text>
<rect x="16" y="388" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 390 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="426" class="card-title"><tspan x="36" dy="0">目標歷史</tspan></text>
<text x="36" y="456" class="tag"><tspan x="36" dy="0">沒有 merge commit</tspan></text>
<text x="36" y="493" class="body"><tspan x="36" dy="0">A′、B′ 接在 D 後面</tspan><tspan x="36" dy="27">識別碼與原本 A、B 不同</tspan></text>
<rect x="16" y="577" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 579 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="615" class="card-title"><tspan x="36" dy="0">原功能分支</tspan></text>
<text x="36" y="645" class="tag"><tspan x="36" dy="0">本例保留 feature-login</tspan></text>
<text x="36" y="682" class="body"><tspan x="36" dy="0">仍指向原來的 A、B</tspan><tspan x="36" dy="27">圖中只畫出目標歷史</tspan></text>
</svg>
