<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 575" width="440" height="575" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">add 後又編輯：兩區版本不同</title><desc id="diagram-desc">暫存區不會隨編輯自動更新。status 可能同時列出已暫存與未暫存變更。 工作區：版本 V2；index.txt：有文字；markdown 語法介紹。暫存區：仍是 V1；index.txt：仍是空檔案。commit 紀錄：尚未 commit；還沒有 commit</desc>
