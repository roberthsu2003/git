<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 581" width="440" height="581" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Merge commit：保留合併點</title><desc id="diagram-desc">本例用 --no-ff，即使可以快轉也建立合併提交。 M 有兩個父提交：C0 與 B；保留 A、B 的歷史；新增明確的合併點</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="581" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C0</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">共同起點</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">A</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">登入表單</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：C0</tspan></text>
<circle cx="48" cy="234" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="240" text-anchor="middle" class="commit">B</text>
<text x="84" y="226" class="ref"><tspan x="84" dy="0">feature-login</tspan></text>
<text x="84" y="277" class="eyebrow"><tspan x="84" dy="0">父 commit：A</tspan></text>
<circle cx="48" cy="328" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="334" text-anchor="middle" class="commit">M</text>
<text x="84" y="320" class="ref"><tspan x="84" dy="0">compare-merge</tspan></text>
<text x="84" y="371" class="eyebrow"><tspan x="84" dy="0">父 commit：C0、B</tspan></text>
<rect x="16" y="388" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 390 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="426" class="card-title"><tspan x="36" dy="0">M 有兩個父提交</tspan></text>
<text x="36" y="456" class="tag"><tspan x="36" dy="0">C0 與 B</tspan></text>
<text x="36" y="493" class="body"><tspan x="36" dy="0">保留 A、B 的歷史</tspan><tspan x="36" dy="27">新增明確的合併點</tspan></text>
</svg>
