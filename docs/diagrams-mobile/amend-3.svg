<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 797" width="440" height="797" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">已分享的提交不要 amend</title><desc id="diagram-desc">改寫已分享歷史會讓同學的接續提交分岔；最後一筆已分享時，優先新增修正 commit。 你的改寫：C2’ 識別碼不同；同學的 C3 接在 C2 後；C2’ 與 C3 已分岔。正確做法：新增修正；保留 C2；再提交修正 commit；不用改寫歷史</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="797" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">P</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">共同起點</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">C2</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">你已分享的版本</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：P</tspan></text>
<circle cx="48" cy="234" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="240" text-anchor="middle" class="commit">C2’</text>
<text x="84" y="226" class="ref"><tspan x="84" dy="0">你改寫的版本</tspan></text>
<text x="84" y="277" class="eyebrow"><tspan x="84" dy="0">父 commit：P</tspan></text>
<circle cx="48" cy="328" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="334" text-anchor="middle" class="commit">C3</text>
<text x="84" y="320" class="ref"><tspan x="84" dy="0">同學接續的版本</tspan></text>
<text x="84" y="371" class="eyebrow"><tspan x="84" dy="0">父 commit：C2</tspan></text>
<rect x="16" y="388" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 390 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="426" class="card-title"><tspan x="36" dy="0">你的改寫</tspan></text>
<text x="36" y="456" class="tag"><tspan x="36" dy="0">C2’ 識別碼不同</tspan></text>
<text x="36" y="493" class="body"><tspan x="36" dy="0">同學的 C3 接在 C2 後</tspan><tspan x="36" dy="27">C2’ 與 C3 已分岔</tspan></text>
<rect x="16" y="577" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 579 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="615" class="card-title"><tspan x="36" dy="0">正確做法</tspan></text>
<text x="36" y="645" class="tag"><tspan x="36" dy="0">新增修正</tspan></text>
<text x="36" y="682" class="body"><tspan x="36" dy="0">保留 C2</tspan><tspan x="36" dy="27">再提交修正 commit</tspan><tspan x="36" dy="27">不用改寫歷史</tspan></text>
</svg>
