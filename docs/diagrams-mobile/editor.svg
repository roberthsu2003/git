<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 616" width="440" height="616" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">nano：編輯、儲存與離開</title><desc id="diagram-desc">nano 的 ^ 表示 Ctrl；編輯檔案還不是 Git commit，要另外 add 與 commit。 1. 輸入內容：鍵盤編輯文字；touch 建立空檔案；nano 開啟文字編輯器。2. 儲存檔案：Ctrl + O → Enter；按 Ctrl + O；確認檔名後按 Enter。3. 離開編輯器：Ctrl + X；儲存後按 Ctrl + X；回到終端機；用 cat 檢查內容</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="616" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">1. 輸入內容</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">鍵盤編輯文字</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">touch 建立空檔案</tspan><tspan x="36" dy="27">nano 開啟文字編輯器</tspan></text>
<rect x="16" y="207" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 209 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="245" class="card-title"><tspan x="36" dy="0">2. 儲存檔案</tspan></text>
<text x="36" y="275" class="tag"><tspan x="36" dy="0">Ctrl + O → Enter</tspan></text>
<text x="36" y="312" class="body"><tspan x="36" dy="0">按 Ctrl + O</tspan><tspan x="36" dy="27">確認檔名後按 Enter</tspan></text>
<rect x="16" y="396" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 398 H 412" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="434" class="card-title"><tspan x="36" dy="0">3. 離開編輯器</tspan></text>
<text x="36" y="464" class="tag"><tspan x="36" dy="0">Ctrl + X</tspan></text>
<text x="36" y="501" class="body"><tspan x="36" dy="0">儲存後按 Ctrl + X</tspan><tspan x="36" dy="27">回到終端機</tspan><tspan x="36" dy="27">用 cat 檢查內容</tspan></text>
</svg>
