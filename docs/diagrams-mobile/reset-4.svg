<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 730" width="440" height="730" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">備份分支不會跟著 reset 移動</title><desc id="diagram-desc">能找回是因為 V3 已提交且仍有名稱指向它；hard 丟棄的未提交修改不能用 reflog 找回。 lesson-start：備份仍指向 V3；reset 只移動目前分支；備份分支不會跟著移；可比較也可移回去。reflog：找移走的 commit；記錄分支 recent 位置；V3 識別碼查得到；未提交修改救不回</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="730" rx="16" fill="#fafbf7"/>
<circle cx="48" cy="46" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="52" text-anchor="middle" class="commit">C1</text>
<text x="84" y="38" class="ref"><tspan x="84" dy="0">HEAD → main（已移回）</tspan></text>
<text x="84" y="89" class="eyebrow"><tspan x="84" dy="0">起點／圖中未列出父 commit</tspan></text>
<circle cx="48" cy="140" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="146" text-anchor="middle" class="commit">C2</text>
<text x="84" y="132" class="ref"><tspan x="84" dy="0">V2</tspan></text>
<text x="84" y="183" class="eyebrow"><tspan x="84" dy="0">父 commit：C1</tspan></text>
<circle cx="48" cy="234" r="20" fill="#fff" stroke="#748f61" stroke-width="2"/><text x="48" y="240" text-anchor="middle" class="commit">C3</text>
<text x="84" y="226" class="ref"><tspan x="84" dy="0">lesson-start（仍在 V3）</tspan></text>
<text x="84" y="277" class="eyebrow"><tspan x="84" dy="0">父 commit：C2</tspan></text>
<rect x="16" y="294" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 296 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="332" class="card-title"><tspan x="36" dy="0">lesson-start</tspan></text>
<text x="36" y="362" class="tag"><tspan x="36" dy="0">備份仍指向 V3</tspan></text>
<text x="36" y="399" class="body"><tspan x="36" dy="0">reset 只移動目前分支</tspan><tspan x="36" dy="27">備份分支不會跟著移</tspan><tspan x="36" dy="27">可比較也可移回去</tspan></text>
<rect x="16" y="510" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 512 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="548" class="card-title"><tspan x="36" dy="0">reflog</tspan></text>
<text x="36" y="578" class="tag"><tspan x="36" dy="0">找移走的 commit</tspan></text>
<text x="36" y="615" class="body"><tspan x="36" dy="0">記錄分支 recent 位置</tspan><tspan x="36" dy="27">V3 識別碼查得到</tspan><tspan x="36" dy="27">未提交修改救不回</tspan></text>
</svg>
