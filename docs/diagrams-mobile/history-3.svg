<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 427" width="440" height="427" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">查詢歷史不會移動分支</title><desc id="diagram-desc">這些查詢不會切換分支或改動工作區；真的要在舊版本操作才用 switch --detach。 show：只讀取不切換；HEAD 是新增聯絡資訊；HEAD~1 是新增團隊介紹；工作區不受影響。diff 比較兩筆：前一筆 → 目前版本；差異是新增 contact.txt；HEAD~1 沿第一父回溯</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="427" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">show</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">只讀取不切換</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">HEAD 是新增聯絡資訊</tspan><tspan x="36" dy="27">HEAD~1 是新增團隊介紹</tspan><tspan x="36" dy="27">工作區不受影響</tspan></text>
<rect x="16" y="234" width="408" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 236 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="272" class="card-title"><tspan x="36" dy="0">diff 比較兩筆</tspan></text>
<text x="36" y="302" class="tag"><tspan x="36" dy="0">前一筆 → 目前版本</tspan></text>
<text x="36" y="339" class="body"><tspan x="36" dy="0">差異是新增 contact.txt</tspan><tspan x="36" dy="27">HEAD~1 沿第一父回溯</tspan></text>
</svg>
