<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 568" width="440" height="568" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">剛建立專案：還沒有 commit</title><desc id="diagram-desc">先在工作區建立檔案，再決定要把哪個版本加入暫存區。 工作區：實際編輯的檔案；目前沒有檔案。暫存區：準備提交的版本；目前沒有檔案。commit 紀錄：已保存的版本；還沒有 commit</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:18px;fill:#5e7653}.body{font-size:21px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:18px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="440" height="568" rx="16" fill="#fafbf7"/>
<rect x="16" y="18" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 20 H 412" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="56" class="card-title"><tspan x="36" dy="0">工作區</tspan></text>
<text x="36" y="86" class="tag"><tspan x="36" dy="0">實際編輯的檔案</tspan></text>
<text x="36" y="123" class="body"><tspan x="36" dy="0">目前沒有檔案</tspan></text>
<rect x="16" y="200" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 202 H 412" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="238" class="card-title"><tspan x="36" dy="0">暫存區</tspan></text>
<text x="36" y="268" class="tag"><tspan x="36" dy="0">準備提交的版本</tspan></text>
<text x="36" y="305" class="body"><tspan x="36" dy="0">目前沒有檔案</tspan></text>
<rect x="16" y="382" width="408" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 28 384 H 412" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="36" y="420" class="card-title"><tspan x="36" dy="0">commit 紀錄</tspan></text>
<text x="36" y="450" class="tag"><tspan x="36" dy="0">已保存的版本</tspan></text>
<text x="36" y="487" class="body"><tspan x="36" dy="0">還沒有 commit</tspan></text>
</svg>
