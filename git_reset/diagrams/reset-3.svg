<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">reset --hard：工作區也改成目標版本</title><desc id="diagram-desc">先保留需要的內容再操作。hard 不是「刪除所有未追蹤檔案」，但阻擋檔案寫入的未追蹤內容可能被移除。 工作區：改成 V1；受追蹤檔案的修改被覆蓋。暫存區：回到 V1；與 C1 一致。main 與 HEAD：回到 C1（V1）；三者都對齊目標版本</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="516" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">10｜reset 的三種模式</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">reset --hard：工作區也改成目標版本</tspan></text>
<rect x="36" y="144" width="284" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 308" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">工作區</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">改成 V1</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">受追蹤檔案的修改被覆蓋</tspan></text>
<rect x="338" y="144" width="284" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 350 146 H 610" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="182" class="card-title"><tspan x="358" dy="0">暫存區</tspan></text>
<text x="358" y="212" class="tag"><tspan x="358" dy="0">回到 V1</tspan></text>
<text x="358" y="249" class="body"><tspan x="358" dy="0">與 C1 一致</tspan></text>
<rect x="640" y="144" width="284" height="168" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 652 146 H 912" stroke="#628c87" stroke-width="3" stroke-linecap="round"/>
<text x="660" y="182" class="card-title"><tspan x="660" dy="0">main 與 HEAD</tspan></text>
<text x="660" y="212" class="tag"><tspan x="660" dy="0">回到 C1（V1）</tspan></text>
<text x="660" y="249" class="body"><tspan x="660" dy="0">三者都對齊目標版本</tspan></text>
<rect x="36" y="336" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="367" class="command"><tspan x="54" dy="0">git reset --hard C1</tspan></text>
<text x="36" y="434" class="note"><tspan x="36" dy="0">先保留需要的內容再操作。hard 不是「刪除所有未追蹤檔案」，但阻擋檔案寫入的未追蹤內容可能被</tspan><tspan x="36" dy="27">移除。</tspan></text>
</svg>
