<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 667" width="960" height="667" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">把暫存變更加入最後一筆提交</title><desc id="diagram-desc">舊 commit 不是立即消失；amend 建立新 commit，分支改指向新版本。先用尚未分享的提交練習。 C1：原本版本：識別碼原樣保留；只有 f1.html；main 不再指向它。C2：替代版本：新的識別碼；f1.html 與 f2.html；相同的父 commit P</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="667" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">11｜整理最後一筆提交</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">把暫存變更加入最後一筆提交</tspan></text>
<path d="M 150 175 L 480 150" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<path d="M 150 175 L 480 245" stroke="#a4b39a" stroke-width="2.5" fill="none"/>
<circle cx="150" cy="175" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="150" y="181" text-anchor="middle" class="commit">P</text><text x="150" y="141" text-anchor="middle" class="ref">共同父 commit</text>
<circle cx="480" cy="150" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="480" y="156" text-anchor="middle" class="commit">C1</text><text x="480" y="116" text-anchor="middle" class="ref">原本 commit</text>
<circle cx="480" cy="245" r="21" fill="#fff" stroke="#748f61" stroke-width="2.5"/><text x="480" y="251" text-anchor="middle" class="commit">C2</text><text x="480" y="211" text-anchor="middle" class="ref">HEAD → main</text>
<text x="36" y="294" class="eyebrow"><tspan x="36" dy="0">圓點是 commit；線表示父子關係；名稱標示分支指向的位置。</tspan></text>
<rect x="36" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 317 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="353" class="card-title"><tspan x="56" dy="0">C1：原本版本</tspan></text>
<text x="56" y="383" class="tag"><tspan x="56" dy="0">識別碼原樣保留</tspan></text>
<text x="56" y="420" class="body"><tspan x="56" dy="0">只有 f1.html</tspan><tspan x="56" dy="27">main 不再指向它</tspan></text>
<rect x="489" y="315" width="435" height="175" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 317 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="353" class="card-title"><tspan x="509" dy="0">C2：替代版本</tspan></text>
<text x="509" y="383" class="tag"><tspan x="509" dy="0">新的識別碼</tspan></text>
<text x="509" y="420" class="body"><tspan x="509" dy="0">f1.html 與 f2.html</tspan><tspan x="509" dy="27">相同的父 commit P</tspan></text>
<rect x="36" y="514" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="545" class="command"><tspan x="54" dy="0">git add f2.html；git commit --amend</tspan></text>
<text x="36" y="612" class="note"><tspan x="36" dy="0">舊 commit 不是立即消失；amend 建立新 commit，分支改指向新版本。先用尚未分享的提交練習。</tspan></text>
</svg>
