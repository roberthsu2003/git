<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 523" width="960" height="523" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">提交會員進度，切回 main 合併修正</title><desc id="diagram-desc">原資料夾現在切到 main，會員功能先保留在 feature-login 的 commit。 worktree-demo/：main；index.txt：Home title；沒有 login.txt；首頁修正已合併。worktree-hotfix/：hotfix-title；index.txt：Home title；修正工作區乾淨</desc>
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#263c32}.eyebrow{font-size:16px;fill:#71826b}.heading{font-size:28px;font-weight:650}.card-title{font-size:24px;font-weight:650}.tag{font-size:17px;fill:#5e7653}.body{font-size:19px}.command{font-size:18px;fill:#e7eee2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{font-size:19px;fill:#61765a}.ref{font-size:16px;fill:#526c47}.commit{font-size:17px;font-weight:650}</style>
<rect width="960" height="523" rx="16" fill="#f5f7f0"/>
<text x="36" y="34" class="eyebrow"><tspan x="36" dy="0">07｜worktree：多任務工作</tspan></text>
<text x="36" y="82" class="heading"><tspan x="36" dy="0">提交會員進度，切回 main 合併修正</tspan></text>
<rect x="36" y="144" width="435" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 48 146 H 459" stroke="#728d60" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="182" class="card-title"><tspan x="56" dy="0">worktree-demo/</tspan></text>
<text x="56" y="212" class="tag"><tspan x="56" dy="0">main</tspan></text>
<text x="56" y="249" class="body"><tspan x="56" dy="0">index.txt：Home title</tspan><tspan x="56" dy="27">沒有 login.txt</tspan><tspan x="56" dy="27">首頁修正已合併</tspan></text>
<rect x="489" y="144" width="435" height="202" rx="10" fill="#ffffff" stroke="#dce3d4"/><path d="M 501 146 H 912" stroke="#b57e4d" stroke-width="3" stroke-linecap="round"/>
<text x="509" y="182" class="card-title"><tspan x="509" dy="0">worktree-hotfix/</tspan></text>
<text x="509" y="212" class="tag"><tspan x="509" dy="0">hotfix-title</tspan></text>
<text x="509" y="249" class="body"><tspan x="509" dy="0">index.txt：Home title</tspan><tspan x="509" dy="27">修正工作區乾淨</tspan></text>
<rect x="36" y="370" width="888" height="62" rx="10" fill="#21362d"/>
<text x="54" y="401" class="command"><tspan x="54" dy="0">會員修改 commit；git switch main；git merge --ff-only hotfix-title</tspan></text>
<text x="36" y="468" class="note"><tspan x="36" dy="0">原資料夾現在切到 main，會員功能先保留在 feature-login 的 commit。</tspan></text>
</svg>
